<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#02121c" />
    <title>Ubåtssim</title>
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Ubåtssim" />
    <link rel="stylesheet" href="./src/ui/style.css" />
  </head>
  <body>
    <div id="app"></div>
    <canvas id="view-overlay" hidden></canvas>
    <div id="hud">
      <div id="mode" class="mode steer">STYRNING</div>
      <button id="menu-btn" type="button" title="Paus och meny (Esc)" aria-label="Paus och meny">☰</button>
      <div id="view-btns"></div>
      <button id="status" type="button" class="panel" title="Visa alla instrument" aria-label="Visa alla instrument" aria-expanded="false"></button>
      <div id="objective" class="panel" hidden></div>
      <aside id="instruments" class="panel"></aside>
      <section id="log" class="panel"></section>
      <section id="cutaway-info" class="panel" hidden aria-live="polite"></section>
      <form id="console" class="panel" autocomplete="off">
        <span class="prompt">&gt;</span>
        <input id="console-input" type="text" spellcheck="false" autocapitalize="off" autocorrect="off" enterkeyhint="send" placeholder="Skriv ett kommando, t.ex. &quot;djup 120&quot;, eller &quot;hjälp&quot;" />
      </form>
      <div id="helm" class="helm"></div>
    </div>
    <div id="menu" hidden></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
